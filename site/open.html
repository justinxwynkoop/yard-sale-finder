<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open in Trove</title>
    <meta
      name="description"
      content="This link opens in the Trove app — discover yard sales and secondhand finds near you."
    />
    <style>
      :root {
        --brand: #1f4d3a;
        --bg: #f7f2e8;
        --ink: #171513;
        --muted: #8a857c;
        --card: #ffffff;
        --hairline: #e5decc;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.55;
      }
      .wrap {
        max-width: 480px;
        margin: 0 auto;
        padding: 64px 24px 96px;
        text-align: center;
      }
      .logo {
        width: 64px;
        height: 64px;
        background: var(--brand);
        border-radius: 16px;
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 32px;
        font-weight: 800;
        margin: 0 auto 20px;
      }
      h1 { font-size: 26px; font-weight: 800; margin: 0 0 8px; letter-spacing: -0.4px; }
      p.sub { color: var(--muted); font-size: 15px; margin: 0 0 28px; }
      .btn {
        display: inline-block;
        background: var(--brand);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        font-size: 16px;
        padding: 14px 28px;
        border-radius: 14px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--hairline);
        border-radius: 16px;
        padding: 20px;
        margin-top: 28px;
        font-size: 14px;
        color: var(--muted);
      }
      .card strong { color: var(--ink); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">T</div>
      <h1 id="headline">Open this in Trove</h1>
      <p class="sub" id="subline">
        A friend shared a find with you on Trove — the app for discovering
        yard sales and secondhand treasures near you.
      </p>
      <a class="btn" id="open-btn" href="#">Open in Trove</a>
      <div class="card">
        <strong>Don&rsquo;t have Trove yet?</strong><br />
        <a
          href="https://apps.apple.com/us/app/id6772838421"
          style="color: #1f4d3a; font-weight: 700"
          >Download Trove free on the App Store</a
        >, then come back and tap the button above &mdash; the shared page will
        open right in the app.
      </div>
    </div>
    <script>
      // Path is /sale/<id> or /listing/<id> (Vercel rewrite -> this page).
      // Build the matching trove:// deep link for the button. Tapping it is a
      // user gesture, so iOS/Android will hand off to the app if installed.
      (function () {
        var m = location.pathname.match(/^\/(sale|listing)\/([A-Za-z0-9-]+)/);
        var btn = document.getElementById('open-btn');
        if (m) {
          btn.href = 'trove://' + m[1] + '/' + m[2];
          if (m[1] === 'listing') {
            document.getElementById('headline').textContent =
              'Open this listing in Trove';
          } else {
            document.getElementById('headline').textContent =
              'Open this sale in Trove';
          }
        } else {
          // No id (someone hit /open directly) — just link the scheme root.
          btn.href = 'trove://';
        }
      })();
    </script>
  </body>
</html>
