# Minimal Supabase project config — used by `npx supabase` CLI.
# Full reference: https://supabase.com/docs/guides/cli/config
project_id = "yard-sale-finder"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Require email confirmation before a session is issued. This is what
# makes the post-signup VerifyEmailScreen (6-digit OTP) the gate into the
# app. NOTE: this governs `supabase start` (local). The LIVE project's
# equivalent is the dashboard "Confirm email" toggle (mailer_autoconfirm),
# which must ALSO be on, and the "Confirm signup" email template must
# include {{ .Token }} so the 6-digit code is delivered, not just a link.
enable_confirmations = true

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083
